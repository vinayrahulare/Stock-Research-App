# Same layout as cloud-db-inventory: Postgres + Python backend + Vite/nginx frontend
services:
  postgres:
    image: postgres:17-alpine
    container_name: si-investing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: si_user
      POSTGRES_PASSWORD: si_password
      POSTGRES_DB: si_investing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "si_user", "-q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: si-investing-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://si_user:si_password@postgres:5432/si_investing
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: si-investing-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
